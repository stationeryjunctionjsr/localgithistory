services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stationery-backend
    volumes:
      - ./backend:/app
      - /app/.venv  # Keep the container's virtualenv isolated from host
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://stationeryjunction.com,https://www.stationeryjunction.com
      - ENVIRONMENT=production
      # Set to "true" during scheduled upgrades
      - MAINTENANCE_MODE=false
      # HA Configuration (Total DB Connections = WORKERS * (POOL_SIZE + MAX_OVERFLOW))
      # Values are read from the root .env file â€” change them there when switching databases.
      - WORKERS=${WORKERS:-4}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-2}
      - MYSQL_DATABASE_URL=${MYSQL_DATABASE_URL}
    # Run via run.py to execute pre-flight tasks (IP whitelist) and use WORKERS env var
    command: python run.py
    # Raise the OS TCP accept-queue to match Uvicorn's backlog=2048 setting.
    # Without this the Linux kernel caps it at its default (128 on many base images),
    # causing connection drops during sudden production traffic spikes.
    sysctls:
      net.core.somaxconn: 2048
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps # For local dev, we only need the deps stage and then we run dev
    container_name: stationery-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules # Keep node_modules isolated from the host
      - /app/.next # Keep next cache isolated
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.stationeryjunction.com/api
    depends_on:
      - backend
    # Run dev server inside the container
    command: npm run dev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
