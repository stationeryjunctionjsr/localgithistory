name: Backend Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest

    env:
      # ── Required secrets — set these in GitHub repo → Settings → Secrets ──
      # DB_URL must point to a test/QA database reachable from CI (e.g. via bastion or tunnel)
      DB_URL: ${{ secrets.CI_DB_URL }}
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_REFRESH_SECRET_KEY: ${{ secrets.CI_JWT_REFRESH_SECRET_KEY }}
      SENTRY_DSN: ""          # leave empty so Sentry is disabled in CI
      ENVIRONMENT: "test"
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "2"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: pip install ruff && ruff check app/

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short --timeout=60 -x

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: backend/.pytest_cache/
